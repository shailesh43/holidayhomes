name: holidayhomes
description: "Mobile App for holiday homes"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.2.3
  lottie: ^3.3.0

  # Utilities
  intl: ^0.20.2
  logger: ^2.6.2
  encrypt: ^5.0.3
  crypto: ^3.0.7

  # Auth
  flutter_dotenv: ^6.0.0
  flutter_appauth: ^7.0.1
  jwt_decoder: ^2.0.1
  device_info_plus: ^10.1.2

  # Networking & APIs
  http: ^1.2.0
  dio: ^5.9.1
  http_certificate_pinning: ^3.0.1

  # System Storage
  shared_preferences: ^2.5.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
